services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lawfirm_db}
      POSTGRES_USER: ${POSTGRES_USER:-lawfirm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawfirm_secure_pass_2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawfirm_user} -d ${POSTGRES_DB:-lawfirm_db}"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5438}:5432"

  web:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8005}:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

volumes:
  postgres_data:
